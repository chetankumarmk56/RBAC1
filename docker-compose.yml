services:
  db:
    image: postgres:16-alpine
    container_name: rbac_poc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rbac
      POSTGRES_PASSWORD: rbac
      POSTGRES_DB: rbac_poc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbac -d rbac_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
